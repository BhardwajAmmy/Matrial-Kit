name: Validate and package ExactHousing room studio
on:
  push:
    branches:
      - exacthousing-room-studio-v1
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build installable packages
        run: |
          rm -rf dist
          mkdir -p dist/standalone/assets dist/plugin/exacthousing-material-studio/assets
          cp index.html README.md dist/standalone/
          cp assets/studio.css assets/studio.js dist/standalone/assets/
          (cd dist/standalone && zip -qr ../exacthousing-standalone.zip .)
          cp wordpress-plugin/exacthousing-material-studio.php dist/plugin/exacthousing-material-studio/
          cp wordpress-plugin/readme.txt dist/plugin/exacthousing-material-studio/
          cp wordpress-plugin/assets/template.html dist/plugin/exacthousing-material-studio/assets/
          cp assets/studio.css assets/studio.js dist/plugin/exacthousing-material-studio/assets/
          (cd dist/plugin && zip -qr ../exacthousing-wordpress-plugin.zip exacthousing-material-studio)
      - name: Install browser test tools
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run browser interaction tests
        run: |
          python3 -m http.server 4173 --directory . >/tmp/ehx-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break || sleep 1; done
          node tests/room-studio-smoke.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exacthousing-room-studio-browser-shots
          path: artifacts/*.png
          if-no-files-found: ignore
      - name: Check JavaScript syntax
        run: node --check assets/studio.js
      - name: Check WordPress PHP syntax
        run: php -l wordpress-plugin/exacthousing-material-studio.php
      - name: Verify distribution ZIPs
        run: |
          unzip -t dist/exacthousing-standalone.zip
          unzip -t dist/exacthousing-wordpress-plugin.zip
          unzip -p dist/exacthousing-wordpress-plugin.zip exacthousing-material-studio/exacthousing-material-studio.php | grep -q "Plugin Name: ExactHousing Material Studio"
          unzip -p dist/exacthousing-wordpress-plugin.zip exacthousing-material-studio/assets/studio.js | grep -q "OrbitControls"
      - name: Upload install packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exacthousing-integrated-v2-packages
          path: dist/*.zip
          if-no-files-found: error
